# Publicación en Netlify: el sitio es estático (no necesita compilar).
[build]
  publish = "."

# La raíz lleva al piloto mientras exista una sola locación
[[redirects]]
  from = "/"
  to = "/greenhouse/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # Siempre pedir la última versión (evita que el navegador muestre una copia vieja)
    Cache-Control = "public, max-age=0, must-revalidate"
