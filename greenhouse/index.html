import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, matchMedia('(pointer: coarse)').matches ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.68;

const scene = new THREE.Scene();
scene.environmentIntensity = 0.7;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 1200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 1.5; controls.maxDistance = 90;

// Luz de día (provisional; la iluminación definitiva es la Etapa 4)
const hemi = new THREE.HemisphereLight(0xeef3f7, 0x5d6b42, 0.35); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 3.2);
sun.castShadow = true;
const cielo = cieloHora(scene, renderer, sun);
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 70 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

// Terreno (prado) – simplificado hasta tener la captura
let ground = null;   // se crea al leer los datos del venue (necesita el contorno del lago)

// Corte para "ver interior": oculta todo lo que esté por encima de 2,6 m
const roofCut = new THREE.Plane(new THREE.Vector3(0, -1, 0), 2.6);
let interior = false;

let composer = null;
if (!matchMedia('(pointer: coarse)').matches) {
  try {
    composer = new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    composer.addPass(new RenderPass(scene, camera));
    const ao = new GTAOPass(scene, camera, innerWidth, innerHeight);
    ao.updateGtaoMaterial({ radius: 0.55, distanceExponent: 1.4, thickness: 1.0, scale: 1.0, samples: 12 });
    ao.blendIntensity = 0.85; composer.addPass(ao);
    // el follaje de hojas recortadas no debe generar sombras cuadradas: se oculta en la pasada de oclusión
    const ocultar = ao.overrideVisibility.bind(ao);
    ao.overrideVisibility = function () { ocultar(); scene.traverse(o => { if (o.userData.sinAO && o.visible) { o.visible = false; this._visibilityCache.push(o); } }); };
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.28, 0.35, 1.15));
    composer.addPass(new OutputPass());
  } catch (e) { console.warn('Post-proceso desactivado', e); composer = null; }
}
const dibujar = () => {
  if (composer) { try { composer.render(); return; } catch (e) { console.warn('Post-proceso desactivado', e); composer = null; } }
  renderer.render(scene, camera);
};
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer?.setSize(innerWidth, innerHeight); });
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  exterior.update(dt);
  hotspots.update();
  if (performance.now() - planoT > 120) { planoT = performance.now();
    if (walk.enabled) plano.setPosition(walk.planPos, walk.yaw);
    else plano.setPosition([controls.target.x, -controls.target.z], Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z)); }
  if (walk.enabled) { walk.update(dt); dibujar(); return; }
  if (anim) {
    anim.t = Math.min(1, anim.t + 0.018); const k = ease(anim.t);
    camera.position.lerpVectors(anim.p0, anim.p1, k); controls.target.lerpVectors(anim.q0, anim.q1, k);
    if (anim.t >= 1) anim = null;
  }
  controls.update(); dibujar();
});
window.__gh = { scene, venue, counts, renderer, walk };   // para pruebas automáticas
requestAnimationFrame(() => espejoBar(renderer, scene));   // reflejo de los espejos del bar (una sola captura)

// ---- Día · Atardecer · Noche ----
const ambiente = crearAmbiente({ scene, renderer, sun, hemi, cielo, venue, alturaTerreno,
  alCambiar: () => requestAnimationFrame(() => espejoBar(renderer, scene)) });   // los espejos reflejan la nueva luz
const horaBtns = document.querySelectorAll('#hora button');
horaBtns.forEach(b => b.onclick = () => {
  if (b.dataset.hora === ambiente.modo) return;
  fadeEl.style.opacity = 0.85;
  setTimeout(() => { ambiente.set(b.dataset.hora); horaBtns.forEach(x => x.classList.toggle('on', x === b)); fadeEl.style.opacity = 0; }, 360);
});
const ld = document.getElementById('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 700);
</script>
